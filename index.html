<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabalarm | A Sabaton themed alarm clock</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./media/logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    </style>
</head>

<body id="body" onload="livetime()">
    <h2 id="h2time">00:00:00</h2>
    <h3>A alarm clock the plays music from Sabaton</h3>
    <h4>Disclaimer: This has no affiliation with the band Sabaton. I am just a fan who codes.</h4>
    <br>
    <label for="date-time">Select Date and Time:</label>
    <input id="date-time" onchange="timeset(this.value)" type="datetime-local" />

    <br>
    <label for="song-selection">Select Song:</label>
    <select id="song-selection" onchange="thumbnailChange()">
        <option id="xmasTruceOption" disabled value="Christmas Truce">Christmas Truce</option>
        <option id="deadMenOption" disabled value="The Attack of the Dead Men">The Attack of the Dead Men</option>
        <option id="primoVictoriaOption" disabled value="Primo Victoria">Primo Victoria</option>
        <option value="Ghost Division">Ghost Division</option>
        <option id="verdunOption" value="Fields of Verdun">Fields of Verdun</option>
        <option value="Metal Machine">Metal Machine</option>
        <option value="Templars">Templars</option>
        <option value="To Hell and Back">To Hell and Back</option>
        <option value="White Death">White Death</option>
        <option value="The Royal Guard">The Royal Guard</option>
        <option value="Dreadnought">Dreadnought</option>
        <option value="Bismarck">Bismarck</option>
        <option value="Soldiers of Heaven">Soldiers of Heaven</option>
        <option value="Steel Commanders">Steel Commanders</option>
    </select>

    <br>
    <button id="alarmset" onclick="alarmset()">
        Set Alarm
    </button>

    <button id="alarmcancel" onclick="alarmcancel()">
        Cancel Alarm
    </button>

    <br>
    <br>

    <!-- Placeholder image -->
    <img id="alarm-placeholder" src="https://i.ytimg.com/vi/ICfzQVh3lvs/hq720.jpg" alt="Ghost Division Thumbnail" width="560" height="315" />

    <!-- Hidden YouTube player -->
    <div id="player" style="display: none;"></div>
    
    <br>
    <footer>
        <p id="footer">Developed by Rahul Lal | <a href="https://rahul-lal.github.io/" target="_blank">Portfolio</a> | <a
                href="https://github.com/rahul-lal" target="_blank">GitHub</a></p>
    </footer>

    <script src="script.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
